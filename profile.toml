statement = """
Kevin urgently needs a remote job of this type. Salary and seniority are not
priorities: junior/mid is fine, and being overqualified is a positive, never a con.
A partial skill match (roughly half the requirements) with room to learn the rest is a
good match, as long as the role is genuinely his kind of work. A simpler role he can do
today beats a fancier role needing several unknown skills.
"""
